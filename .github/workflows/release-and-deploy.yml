name: Release and Deploy (reusable)

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      release_tag:
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-and-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: Run CodeQL analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript,typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v2
      - name: Run CodeQL
        uses: github/codeql-action/analyze@v2

  build-and-push:
    name: "Optional: Build and push image (if caller wants)"
    runs-on: ubuntu-latest
    if: ${{ inputs.image_tag == '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/indodanazwide:${{ github.sha }}

  create-release:
    name: Create GitHub Release (optional)
    runs-on: ubuntu-latest
    needs: [codeql]
    steps:
      - name: Compute release tag
        id: set_tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.ref_name }}" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.set_tag.outputs.tag }}
          name: Release ${{ steps.set_tag.outputs.tag }}
          body: Automated release from workflow_call

  deploy:
    name: Deploy to cluster
    needs: create-release
    runs-on: [self-hosted, Linux, X64, zwidek8sadmin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy manifests (use provided image_tag)
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          IMAGE: ${{ inputs.image_tag }}
        run: |
          kubectl -n default set image deployment/indodanazwide-deployment indodanazwide-container=$IMAGE || kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          sed "s|{{APP_DOMAIN}}|${APP_DOMAIN}|g" k8s/ingress.yml | kubectl apply -f -

  post-scan:
    name: Container scan (post-deploy scan)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image_tag }}
          format: table
          exit-code: "1"
          vuln-type: "os,library"
