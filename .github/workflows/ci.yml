name: Continuous Integration

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
    paths:
      - .github/workflows/**
      - public/**
      - src/**
      - package.json
      - package-lock.json
      - eslint.config.js
      - index.html
      - tsconfig.json
      - tsconfig.node.json
      - tsconfig.app.json
      - vite.config.ts
  pull_request:
    branches:
      - dev
      - main
    paths:
      - .github/workflows/**
      - public/**
      - src/**
      - package.json
      - package-lock.json
      - eslint.config.js
      - index.html
      - tsconfig.json
      - tsconfig.node.json
      - tsconfig.app.json
      - vite.config.ts
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.detect-changes.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect changes
        id: detect-changes
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.repository.default_branch }}
          filters: |
            workflows:
              - '.github/workflows/**'
            app:
              - 'public/**'
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.js'
              - 'index.html'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'tsconfig.app.json'
              - 'vite.config.ts'

  test-and-build-app:
    name: Test, Lint and Build App
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Cache Vite cache
        uses: actions/cache@v6
        with:
          path: |
            .vite
            node_modules/.cache/vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build app
        run: npm run build --if-present

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-dist
          path: |
            dist
            package.json

  build-docker-image:
    name: Build Docker Image
    runs-on: [self-hosted, Linux, X64, zwidek8sadmin]
    needs: test-and-build-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/indodanazwide:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/indodanazwide:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/indodanazwide:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/indodanazwide:buildcache,mode=max

      - name: Scan pushed image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/indodanazwide:${{ github.sha }}
          format: table
          exit-code: "1"
          vuln-type: "os,library"

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/indodanazwide:${{ github.sha }}
