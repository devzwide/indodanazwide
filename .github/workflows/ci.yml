name: Continuous Integration

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
    paths:
      - .github/workflows/**
      - public/**
      - src/**
      - package.json
      - package-lock.json
      - eslint.config.js
      - index.html
      - tsconfig.json
      - tsconfig.node.json
      - tsconfig.app.json
      - vite.config.ts
  pull_request:
    branches:
      - dev
      - main
    paths:
      - .github/workflows/**
      - public/**
      - src/**
      - package.json
      - package-lock.json
      - eslint.config.js
      - index.html
      - tsconfig.json
      - tsconfig.node.json
      - tsconfig.app.json
      - vite.config.ts
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.detect-changes.outputs.has-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect changes
        id: detect-changes
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.repository.default_branch }}
          filters: |
            workflows:
              - '.github/workflows/**'
            app:
              - 'public/**'
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.js'
              - 'index.html'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'tsconfig.app.json'
              - 'vite.config.ts'

  test-and-build-app:
    name: Test, Lint and Build App
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build app
        run: npm run build --if-present

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-dist
          path: |
            dist
            package.json

  publish:
    name: Publish Artifacts and Release
    runs-on: ubuntu-latest
    needs: test-and-build-app
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: app-dist

      - name: Zip dist for release upload
        run: |
          if [ -d dist ]; then
            zip -r dist.zip dist
          else
            echo "dist not found, creating empty placeholder"
            mkdir -p dist
            echo "no build" > dist/README.txt
            zip -r dist.zip dist
          fi

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist.zip
          asset_name: dist.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages (skip if private)
        run: |
          IS_PRIVATE=$(node -e "console.log(require('./package.json').private||false)")
          if [ "$IS_PRIVATE" = "true" ]; then
            echo "package.json.private = true — skipping npm publish"
            exit 0
          fi
          echo "Publishing to GitHub Packages..."
          npm publish --registry https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
