name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: continuous-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build and push image
    runs-on: [self-hosted, Linux, X64, zwidek8sadmin]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'dev')) }}
    steps:
      - name: Checkout code
        uses: ./.github/actions/checkout
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (with cache)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/indodanazwide:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/indodanazwide:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/indodanazwide:buildcache,mode=max

      - name: Set image-tag output
        id: set-tag
        run: echo "image_tag=ghcr.io/${{ github.repository_owner }}/indodanazwide:${{ github.sha }}" >> $GITHUB_OUTPUT

    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}

  call-release:
    name: Call Release and Deploy workflow
    needs: build-image
    uses: ./.github/workflows/release-and-deploy.yml
    with:
      image_tag: ${{ needs.build-image.outputs.image_tag }}
